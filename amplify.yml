# Build spec de AWS Amplify Hosting (plataforma WEB_COMPUTE, definida en
# infra/amplify.tf) para el SSR de Next.js 15 con App Router.
#
# Amplify autodetecta Next.js, pero el spec se versiona igual para que el
# build sea reproducible y no dependa de la heurística de la consola.
#
# Las variables de entorno (DEMO_MODE, ADMIN_CONSOLE_ENABLED, DYNAMODB_TABLE,
# S3_BUCKET, APP_SECRETS_ARN) las inyecta Terraform en la app de Amplify; acá
# no se declara ninguna. OTP_PEPPER, DEMO_PANEL_KEY y ADMIN_CONSOLE_KEY nunca
# son variables de entorno: la app los lee en runtime desde Secrets Manager con
# el rol de servicio (regla inviolable #2).
#
# ⚠️ Agregar una variable en `infra/amplify.tf` NO alcanza: hay que sumarla
# también a la lista explícita del bucle de más abajo. Si falta ahí, el build
# pasa en verde y la variable simplemente no existe en runtime.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Mismo portón que exige CLAUDE.md antes de cerrar una tarea. Corre en
        # el build para que un despliegue no pueda publicar tipos rotos, lint
        # en rojo o tests fallando: los tests de P1 incluyen el que verifica
        # que el código del OTP no se filtra por la API ni por los logs.
        - npm run verify

        # Las variables de entorno de la app de Amplify existen SOLO durante
        # el build: el cómputo SSR de Next no las hereda. Sin este paso,
        # `process.env.DYNAMODB_TABLE` es undefined en runtime y los Route
        # Handlers responden 500, mientras que /demo-panel devuelve 404 porque
        # DEMO_MODE no vale "true". Volcarlas a `.env.production` es el
        # mecanismo que Next lee del lado del servidor al arrancar.
        #
        # La lista es explícita a propósito, no un volcado de `env`: así no se
        # filtra al artefacto ninguna variable del runner de Amplify. Ninguna
        # de estas cinco es un secreto — APP_SECRETS_ARN identifica al secret
        # pero no da acceso; el pepper del OTP, la clave del panel y la de la
        # consola administrativa se leen en runtime desde Secrets Manager con
        # el rol de servicio (regla inviolable #2), y nunca pasan por acá.
        #
        # `ADMIN_CONSOLE_ENABLED` es el flag de /admin-consola: con el flag
        # ausente o distinto de "true", esa ruta responde 404.
        #
        # Las tres de identidad gobiernan P5: `INTEGRATION_IDENTITY=live`
        # enchufa Rekognition + Textract de verdad (el rol de cómputo ya tiene
        # los permisos), `INTEGRATION_IDENTITY_SELFIE=camara-demo` cambia la
        # prueba de vida por una verificación de presencia —solo demostración,
        # el adaptador exige DEMO_MODE— e `IDENTITY_PAISES_CEDULA` dice qué
        # documentos se aceptan. Ninguna es un secreto.
        #
        # Las cuatro de mensajería habilitan los tres OTP por canales reales.
        # `WHATSAPP_MODULAR_URL` es a dónde apuntar, no una credencial: el
        # bearer del otp-service vive en Secrets Manager bajo la clave
        # `WHATSAPP_MODULAR_TOKEN`, justamente porque acá terminaría escrito en
        # `.env.production` dentro del artefacto de build.
        - |
          for var in DEMO_MODE ADMIN_CONSOLE_ENABLED DYNAMODB_TABLE S3_BUCKET APP_SECRETS_ARN INTEGRATION_IDENTITY INTEGRATION_IDENTITY_SELFIE IDENTITY_PAISES_CEDULA INTEGRATION_OTP WHATSAPP_MODULAR_URL INTEGRATION_OTP_EMAIL OTP_EMAIL_FROM; do
            if [ -n "${!var:-}" ]; then echo "$var=${!var}" >> .env.production; fi
          done
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

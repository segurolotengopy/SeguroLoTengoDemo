version: 2

updates:
  # Dependencias de la app. Next.js queda fijado en 15 por límite de Amplify
  # Hosting (CLAUDE.md, sección Stack): Dependabot puede proponer parches y
  # minors de 15.x, pero el major 16 está explícitamente ignorado.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # React y react-dom se publican en lockstep y comparten internos:
      # `react-dom@X` declara un peer `react@^X`. Subidos por separado el par
      # queda trabado de dos maneras, y las dos se vieron:
      #
      #   1. El PR de react-dom **no puede pasar CI nunca**. Con el lock
      #      todavía en la versión vieja de react, `npm ci` corta con ERESOLVE
      #      antes de llegar a correr un solo test — así quedó el #122, y
      #      reintentar el CI no lo arreglaba.
      #   2. Fusionarlos en secuencia tampoco sirve. `react` y `react-dom`
      #      están clavados en **exacto** en package.json, así que fusionar
      #      uno primero deja `main` con un par desparejo, y eso se despliega
      #      solo (Amplify tiene autoBuild en main).
      #
      # Agrupados con sus `@types`, suben juntos en un único PR. Es el mismo
      # criterio —y la misma clase de falla— que `codeql-action` más abajo.
      # Va **primero** a propósito: los `@types` son devDependencies, y el
      # grupo que los reclama es el primero que coincide.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      dev-dependencies:
        dependency-type: development
        # Los `@types` de React son devDependencies pero pertenecen al grupo
        # `react`. La exclusión es explícita para que el emparejamiento no
        # dependa únicamente del orden de los grupos.
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # ESLint queda atado al pin de Next 15 por transitividad:
      # `eslint-config-next@15.x` declara un peer de ESLint que no admite el
      # major 10, así que un bump de ESLint rompe `npm ci` con ERESOLVE antes
      # de llegar a correr un solo test. Lo comprobó el PR #5, que agrupaba
      # este major con otros dos y quedó imposible de mergear en bloque.
      # Se desbloquea solo cuando `eslint-config-next` salga del ignore de
      # arriba — es decir, cuando Amplify Hosting admita Next 16.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript sale del grupo automático por una razón distinta: el
      # dominio del expediente es de tipado estricto y una máquina de estados
      # con reglas de consecuencia legal (CLAUDE.md, "Reglas de negocio
      # inviolables"). Un major de TS cambia inferencia y chequeos: merece su
      # propio PR, revisado a mano, no venir de pasajero en un grupo de
      # dev-dependencies junto con `@types/node`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Las propias actions del pipeline: una action desactualizada o sin fijar
  # es superficie de ataque de cadena de suministro.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # CodeQL exige que init y analyze corran la misma versión: subidos por
      # separado, cada PR falla solo («Loaded a configuration file for version
      # '4.37.9', but running version '4.38.0'»; así murieron el #110 y el
      # #112). Agrupados, suben juntos en un único PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # Providers de Terraform (infra/.terraform.lock.hcl está versionado a
  # propósito, ver .gitignore).
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
